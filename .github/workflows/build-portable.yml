name: Build portable

on:
  workflow_run:
    workflows: ['Sync upstream']
    types: [completed]
  workflow_dispatch:

concurrency:
  group: build-portable
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sftp-browser

      - uses: microsoft/setup-msbuild@v2

      - name: Cache NuGet packages and vcpkg binaries
        uses: actions/cache@v4
        with:
          path: |
            packages
            ${{ runner.temp }}\vcpkg-cache
          key: portable-${{ hashFiles('vcpkg.json', 'build/packages.config', 'dep/nuget/packages.config') }}

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone -q https://github.com/microsoft/vcpkg dep/vcpkg
          & ./dep/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\vcpkg-cache" | Out-Null
          "VCPKG_ROOT=$env:GITHUB_WORKSPACE\dep\vcpkg" | Out-File $env:GITHUB_ENV -Append
          "VCPKG_DEFAULT_BINARY_CACHE=$env:RUNNER_TEMP\vcpkg-cache" | Out-File $env:GITHUB_ENV -Append

      - name: Generate NOTICE.html
        shell: pwsh
        run: ./build/scripts/Generate-ThirdPartyNotices.ps1 -MarkdownNoticePath ./NOTICE.md -OutputPath ./src/cascadia/CascadiaPackage/NOTICE.html

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          Invoke-WebRequest https://dist.nuget.org/win-x86-commandline/v7.0.1/nuget.exe -OutFile nuget.exe
          ./nuget.exe restore build/packages.config -PackagesDirectory packages -NonInteractive
          ./nuget.exe restore dep/nuget/packages.config -PackagesDirectory packages -NonInteractive

      - name: Pin VCToolsVersion
        shell: pwsh
        run: |
          $o = (./build/scripts/Set-LatestVCToolsVersion.ps1 2>$null) -join "`n"
          $m = [regex]::Match($o, 'Latest VCToolsVersion:\s*(\d[\d.]*)')
          if ($m.Success) { "VCToolsVersion=$($m.Groups[1].Value)" | Out-File $env:GITHUB_ENV -Append }

      - name: Restore solution
        shell: pwsh
        run: msbuild OpenConsole.slnx -t:Restore -p:Platform=x64 -p:Configuration=Release -p:RestoreAdditionalProjectSources=https://api.nuget.org/v3/index.json -m -nologo

      - name: Build
        shell: pwsh
        run: >
          msbuild OpenConsole.slnx
          -t:Terminal\CascadiaPackage
          -p:Platform=x64
          -p:Configuration=Release
          -p:WindowsTerminalBranding=Dev
          -p:WindowsTerminalOfficialBuild=true
          -m -nologo

      - name: Package portable
        shell: pwsh
        run: |
          $msix = (Get-Item 'src/cascadia/CascadiaPackage/AppPackages/*/*.msix').FullName
          $xaml = (Get-Item 'src/cascadia/CascadiaPackage/AppPackages/*/Dependencies/x64/Microsoft.UI.Xaml*.appx').FullName
          $sdk = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots').KitsRoot10
          $mk = Get-Item "$sdk/bin/*/x64/MakeAppx.exe" | Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          ./build/scripts/New-UnpackagedTerminalDistribution.ps1 -PortableMode -TerminalAppX $msix -XamlAppX $xaml -Destination artifacts -MakeAppxPath $mk.FullName

      - uses: actions/upload-artifact@v4
        with:
          name: WindowsTerminal-SFTP-portable-x64
          path: artifacts/*.zip
          retention-days: 30
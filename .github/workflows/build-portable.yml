name: Build portable

on:
  workflow_run:
    workflows: ['Sync upstream']
    types: [completed]
  workflow_dispatch:

concurrency:
  group: build-portable
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sftp-browser

      - uses: microsoft/setup-msbuild@v2

      - name: Cache NuGet packages and vcpkg binaries
        uses: actions/cache@v4
        with:
          path: |
            packages
            ${{ runner.temp }}\vcpkg-cache
          key: portable-${{ hashFiles('vcpkg.json', 'build/packages.config', 'dep/nuget/packages.config') }}

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git init -q dep/vcpkg
          git -C dep/vcpkg remote add origin https://github.com/microsoft/vcpkg
          git -C dep/vcpkg fetch -q --depth 1 origin 927f62e4b8838bd7e441e9c45103a16ffd75007e
          git -C dep/vcpkg checkout -q FETCH_HEAD
          & ./dep/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          "VCPKG_ROOT=$env:GITHUB_WORKSPACE\dep\vcpkg" | Out-File $env:GITHUB_ENV -Append
          "VCPKG_DEFAULT_BINARY_CACHE=$env:RUNNER_TEMP\vcpkg-cache" | Out-File $env:GITHUB_ENV -Append

      - name: Generate NOTICE.html
        shell: pwsh
        run: ./build/scripts/Generate-ThirdPartyNotices.ps1 -MarkdownNoticePath ./NOTICE.md -OutputPath ./src/cascadia/CascadiaPackage/NOTICE.html

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          $nuget = (Get-Command nuget.exe -ErrorAction SilentlyContinue).Source
          if (-not $nuget) {
            dotnet tool install --global NuGet.CommandLine --version 7.0.1
            $nuget = "$env:USERPROFILE\.dotnet\tools\nuget.exe"
          }
          & $nuget restore build/packages.config -PackagesDirectory packages -NonInteractive
          & $nuget restore dep/nuget/packages.config -PackagesDirectory packages -NonInteractive

      - name: Pin VCToolsVersion
        shell: pwsh
        run: |
          $o = (./build/scripts/Set-LatestVCToolsVersion.ps1) -join "`n"
          Write-Host $o
          if ($o -match 'VCToolsVersion:\s*(\S+)') { "VCToolsVersion=$($Matches[1])" | Out-File $env:GITHUB_ENV -Append }

      - name: Restore solution
        shell: pwsh
        run: msbuild OpenConsole.slnx -t:Restore -p:Platform=x64 -p:Configuration=Release -m -nologo

      - name: Build
        shell: pwsh
        run: >
          msbuild OpenConsole.slnx
          -t:Terminal\CascadiaPackage
          -p:Platform=x64
          -p:Configuration=Release
          -p:WindowsTerminalBranding=Dev
          -p:WindowsTerminalOfficialBuild=true
          -m -nologo

      - name: Package portable
        shell: pwsh
        run: |
          $msix = (Get-Item 'src/cascadia/CascadiaPackage/AppPackages/*/*.msix').FullName
          $xaml = (Get-Item 'src/cascadia/CascadiaPackage/AppPackages/*/Dependencies/x64/Microsoft.UI.Xaml*.appx').FullName
          $sdk = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots').KitsRoot10
          $mk = Get-Item "$sdk/bin/*/x64/MakeAppx.exe" | Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          ./build/scripts/New-UnpackagedTerminalDistribution.ps1 -PortableMode -TerminalAppX $msix -XamlAppX $xaml -Destination artifacts -MakeAppxPath $mk.FullName

      - uses: actions/upload-artifact@v4
        with:
          name: WindowsTerminal-SFTP-portable-x64
          path: artifacts/*.zip
          retention-days: 30
name: Sync upstream

on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: feature/sftp-browser

      - name: Fetch changes from original repository
        run: |
          git remote add upstream https://github.com/microsoft/terminal.git
          git fetch --no-tags --prune upstream +refs/heads/main:refs/remotes/upstream/main

      - name: Merge feature/sftp-browser from original repository 
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge -m "merge upstream/main into feature/sftp-browser" upstream/main

      - name: Push
        run: git push origin HEAD:feature/sftp-browser